<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111b2e"/>
      <stop offset=".52" stop-color="#101725"/>
      <stop offset="1" stop-color="#090e18"/>
    </linearGradient>
    <radialGradient id="aurora" cx=".72" cy=".35" r=".62">
      <stop stop-color="#2878ff" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#2555a5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#101725" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge-back" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#2e466d"/>
      <stop offset=".48" stop-color="#1d2d49"/>
      <stop offset="1" stop-color="#141d2d"/>
    </linearGradient>
    <linearGradient id="ribbon" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#69baff"/>
      <stop offset=".38" stop-color="#3989f4"/>
      <stop offset=".78" stop-color="#2859b7"/>
      <stop offset="1" stop-color="#223966"/>
    </linearGradient>
    <linearGradient id="ridge-front" x1=".15" y1="0" x2=".9" y2="1">
      <stop stop-color="#1b2c48"/>
      <stop offset=".6" stop-color="#121e31"/>
      <stop offset="1" stop-color="#0b111d"/>
    </linearGradient>
    <linearGradient id="edge-light" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8ed2ff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#8ed2ff" stop-opacity=".52"/>
      <stop offset="1" stop-color="#8ed2ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#aurora)"/>

  <!-- A quiet light sweep keeps the desktop center open for windows. -->
  <path d="M480 1510C1130 940 1450 510 2200 620c560 82 920 514 1500 430v560c-580-60-930-228-1430-200-700 40-1110 430-1790 460z"
        fill="#397fe0" opacity=".28" filter="url(#soft-glow)"/>

  <!-- Distant layered horizon. -->
  <path d="M0 1370c480-120 720-410 1250-390 500 19 700 240 1190 190 470-48 805-320 1400-255v1245H0z"
        fill="url(#ridge-back)" opacity=".72"/>

  <!-- The signature ShreeOS blue ribbon. -->
  <path d="M-120 1710c560-370 930-790 1570-810 480-14 730 260 1150 250 445-10 690-300 1360-470v610c-545 180-845 400-1385 390-560-9-800-270-1300-210-495 59-770 390-1395 650z"
        fill="url(#ribbon)" opacity=".78"/>
  <path d="M-80 1720c565-342 934-746 1555-763 477-13 720 248 1140 239 438-10 688-285 1305-446"
        fill="none" stroke="url(#edge-light)" stroke-width="7" opacity=".72"/>

  <!-- Foreground contours frame the dock without competing with icons. -->
  <path d="M0 1810c610-310 1020-350 1460-245 435 104 655 265 1110 190 450-75 780-400 1270-470v875H0z"
        fill="url(#ridge-front)"/>
  <path d="M0 1845c590-281 1007-316 1440-212 446 107 671 246 1126 166 447-78 783-377 1274-440"
        fill="none" stroke="#81baff" stroke-opacity=".20" stroke-width="4"/>
  <path d="M0 2040c640-166 1050-178 1515-94 456 82 744 169 1195 96 403-66 703-247 1130-301v419H0z"
        fill="#0b111d" opacity=".8"/>
</svg>
