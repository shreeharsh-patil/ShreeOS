<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Neutral Environment -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#0F0F10" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>

    <!-- Ambient Subtle Cool Lighting -->
    <radialGradient id="ambient-light" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E2C4A" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#141416" stop-opacity="0" />
    </radialGradient>

    <!-- Architectural Layer 1: Cool Slate -->
    <linearGradient id="layer-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C323D" />
      <stop offset="100%" stop-color="#181B20" />
    </linearGradient>

    <!-- Architectural Layer 2: Deep Indigo Accent Curve -->
    <linearGradient id="layer-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2878FF" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#174499" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F0F10" stop-opacity="0" />
    </linearGradient>

    <!-- Architectural Layer 3: Neutral Charcoal -->
    <linearGradient id="layer-charcoal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#1C1C1E" />
    </linearGradient>

    <!-- Architectural Soft Horizon -->
    <linearGradient id="layer-fog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0" />
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="3840" height="2160" fill="url(#bg-grad)" />
  <rect width="3840" height="2160" fill="url(#ambient-light)" />

  <!-- Ambient Glow Ribbon Behind Architecture -->
  <path d="M 800 2160 Q 1920 600 3200 1200 Q 3840 1500 3840 2160 Z" fill="url(#layer-accent)" filter="url(#soft-blur)" />

  <!-- Architectural Ribbons (Minimal, Calming, Architectural Horizons) -->
  <!-- Back Ribbon -->
  <path d="M 0 1600 Q 1200 900 2400 1450 T 3840 1100 L 3840 2160 L 0 2160 Z"
        fill="url(#layer-slate)"
        stroke="rgba(255,255,255,0.04)"
        stroke-width="1.5" />

  <!-- Mid Sculpted Contour -->
  <path d="M 0 1850 Q 1400 1250 2800 1650 Q 3400 1850 3840 1500 L 3840 2160 L 0 2160 Z"
        fill="url(#layer-charcoal)"
        stroke="rgba(255,255,255,0.06)"
        stroke-width="1.5" />

  <!-- Foreground Calm Horizon -->
  <path d="M 0 2000 Q 1600 1700 3200 1950 L 3840 1850 L 3840 2160 L 0 2160 Z"
        fill="#18181A"
        stroke="rgba(255,255,255,0.08)"
        stroke-width="1.5" />

  <!-- Subtle Center Vignette Overlay -->
  <rect width="3840" height="2160" fill="url(#layer-fog)" />
</svg>
