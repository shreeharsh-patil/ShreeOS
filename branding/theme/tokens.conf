# branding/theme/tokens.conf — ShreeOS Master Design System Tokens
# Single source of truth for shell scripts, window managers, and desktop apps.

# --- Mode: dark (default) or light ---
SHREE_THEME_MODE="dark"

# --- Dark Mode Palette ---
SHREE_DARK_DESKTOP_BG="#0F0F10"
SHREE_DARK_SURFACE_PRIMARY="#1C1C1E"
SHREE_DARK_SURFACE_SECONDARY="#242426"
SHREE_DARK_SURFACE_ELEVATED="rgba(35,35,38,0.88)"
SHREE_DARK_TEXT_PRIMARY="#F5F5F7"
SHREE_DARK_TEXT_SECONDARY="#A1A1A6"
SHREE_DARK_TEXT_MUTED="#86868B"
SHREE_DARK_BORDER="rgba(255,255,255,0.10)"

# --- Light Mode Palette ---
SHREE_LIGHT_DESKTOP_BG="#F5F5F7"
SHREE_LIGHT_SURFACE_PRIMARY="#FFFFFF"
SHREE_LIGHT_SURFACE_SECONDARY="#F3F3F5"
SHREE_LIGHT_SURFACE_ELEVATED="rgba(255,255,255,0.82)"
SHREE_LIGHT_TEXT_PRIMARY="#1D1D1F"
SHREE_LIGHT_TEXT_SECONDARY="#6E6E73"
SHREE_LIGHT_TEXT_MUTED="#86868B"
SHREE_LIGHT_BORDER="rgba(0,0,0,0.10)"

# --- Accent Colors ---
SHREE_ACCENT="#2878FF"
SHREE_ACCENT_LIGHT="#3A88FF"
SHREE_ACCENT_HOVER="#1A62E8"

# --- Status Colors ---
SHREE_SUCCESS="#30A46C"
SHREE_WARNING="#F7B955"
SHREE_ERROR="#E54D2E"

# --- Radii ---
SHREE_RADIUS_WINDOW="10"
SHREE_RADIUS_CONTROL="6"
SHREE_RADIUS_DOCK="16"
SHREE_RADIUS_MENU="8"

# --- Typography ---
SHREE_FONT_UI="Inter"
