# branding/theme/tokens.conf — ShreeOS Master Design System Tokens
# Single source of truth for shell scripts, window managers, and desktop apps.
# Inspired by modern macOS clarity + ShreeOS cool-blue identity.

# --- Mode: dark (default) or light ---
SHREE_THEME_MODE="dark"

# --- Dark Mode Palette ---
SHREE_DARK_DESKTOP_BG="#1C1C1E"
SHREE_DARK_SURFACE_PRIMARY="#2C2C2E"
SHREE_DARK_SURFACE_SECONDARY="#1C1C1E"
