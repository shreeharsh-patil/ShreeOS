SHREE_FONT_SIZE_UI="10"
SHREE_FONT_SIZE_TITLE="14"

# --- Motion Curves & Durations ---
SHREE_ANIM_FAST="120ms"
SHREE_ANIM_NORMAL="180ms"
SHREE_ANIM_SLOW="240ms"
