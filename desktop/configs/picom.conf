# ShreeOS Picom Compositor Configuration
# Restrained shadows, subtle rounded corners, crisp tearing-free rendering

# --- Backend & Performance ----------------------------------------------
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;

# --- Window Corners & Geometry ------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'dmenu'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Shadows ------------------------------------------------------------
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.28;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "window_type = 'dock'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# --- Fading & Transitions -----------------------------------------------
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
fade-exclude = [];

# --- Transparency & Blurring --------------------------------------------
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Window Type Rules --------------------------------------------------
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.96; shadow = true; };
  dropdown_menu = { opacity = 0.96; shadow = true; };
};
