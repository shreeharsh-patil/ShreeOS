name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  RELEASE_VERSION: 0.3.0-prototype
  RELEASE_TAG: v0.3.0-prototype
  RELEASE_PROFILE: plasma
  RELEASE_ISO: shreeos-0.3.0-prototype-plasma-amd64.iso

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]') }}
    name: Build and certify current Plasma prototype
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      options: --privileged
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned live-build and image test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build=1:20250505+deb13u1 \
            debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 qemu-system-gui qemu-utils ovmf xvfb xauth rsync ca-certificates \
            debian-archive-keyring shellcheck python3 librsvg2-bin

      - name: Validate prototype scripts and configuration
        run: |
          bash -n scripts/build-debian-prototype.sh
          bash -n tests/prototype/test-config.sh
          bash -n tests/prototype/test-iso.sh
          shellcheck --severity=error \
            scripts/build-debian-prototype.sh \
            tests/prototype/test-config.sh \
            tests/prototype/test-iso.sh \
            prototype/debian-live/config/includes.chroot/lib/live/config-hooks/2000-lock-live-user \
            prototype/debian-live/config/includes.chroot/usr/local/sbin/shreeos-live-boot-check \
            prototype/debian-live/profiles/plasma/hooks/9001-shreeos-sddm.hook.chroot \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-plasma-first-login \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-plasma-dock \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-open-downloads \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-open-trash \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-theme \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-motion \
            prototype/debian-live/features/includes.chroot/usr/local/bin/shreeos-software \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/sbin/shreeos-sddm-live-autologin
          bash tests/prototype/test-config.sh
          python3 tests/prototype/test-desktop-config.py
          python3 tests/prototype/test-plasma-config.py
          python3 tests/prototype/test-system-features.py
          python3 tests/prototype/test-search-calculator.py
          python3 tests/prototype/test-workspace-overview.py

      - name: Build ShreeOS Plasma ISO
        run: |
          mkdir -p build-logs/prototype-qemu
          SHREEOS_LIVE_PROFILE="$RELEASE_PROFILE" bash scripts/build-debian-prototype.sh
          test -s "out/$RELEASE_ISO"

      - name: Certify BIOS and UEFI boot plus desktop visuals
        run: |
          QEMU_LOG_DIR=build-logs/prototype-qemu \
            bash tests/prototype/test-iso.sh "out/$RELEASE_ISO" "$RELEASE_PROFILE"

      - name: Validate release assets
        id: meta
        run: |
          checksum="out/$RELEASE_ISO.sha256"
          asset_prefix="${RELEASE_ISO%-amd64.iso}"
          packages="out/${asset_prefix}-packages.txt"
          build_info="out/${asset_prefix}-build-info.txt"
          for required in "out/$RELEASE_ISO" "$checksum" "$packages" "$build_info"; do
            test -s "$required"
          done
          (
            cd out
            sha256sum -c "$RELEASE_ISO.sha256"
            sha256sum "$RELEASE_ISO" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          rm -rf release-assets
          mkdir release-assets
          cp "out/$RELEASE_ISO" "$checksum" "$packages" "$build_info" out/SHA256SUMS release-assets/
          echo "artifact_name=shreeos-plasma-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload certified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload QEMU logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-plasma-release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/prototype-qemu/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  publish:
    if: ${{ needs.build.result == 'success' }}
    name: Publish ShreeOS Plasma prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download certified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Revalidate checksums
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          sha256sum -c "$RELEASE_ISO.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          ShreeOS ${RELEASE_VERSION} Plasma preview.

          This prerelease is published only after the current Debian Live Plasma image passes configuration checks, package/asset validation, checksum validation, BIOS boot, UEFI boot, and automated desktop screenshot gates.

          It is a prototype prerelease, not the final stable ShreeOS release. Installer-to-disk, installed-system update/recovery, broader hardware coverage, and interactive acceptance remain release blockers for a stable version.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "ShreeOS ${RELEASE_VERSION}" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "ShreeOS ${RELEASE_VERSION}" \
              --notes-file release-notes.md \
              --prerelease
          fi
