name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  RELEASE_PROFILE: desktop

jobs:
  build:
    if: ${{ github.ref_type == 'tag' || (github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]')) }}
    name: Build and certify desktop ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release version
        id: version
        run: |
          source build.conf
          expected_tag="v${DISTRO_VERSION}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME:-}" != "$expected_tag" ]]; then
              echo "Tag ${GITHUB_REF_NAME:-<none>} does not match build.conf ($expected_tag)" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF:-}" != "refs/heads/master" ]]; then
            echo "Release builds must come from the matching tag or master" >&2
            exit 1
          fi
          prerelease=false
          [[ "$DISTRO_VERSION" == *-dev ]] && prerelease=true
          {
            echo "version=$DISTRO_VERSION"
            echo "tag=$expected_tag"
            echo "prerelease=$prerelease"
            echo "artifact_name=shreeos-desktop-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: bash scripts/install-build-deps-apt.sh

      - name: Restore exact toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            build/tools
            build/sysroot
          key: shreeos-toolchain-cache-v3-abi-glibc2.40-gcc14.2.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.conf', 'scripts/common.sh', 'scripts/verify-stage.sh', 'tests/smoke/test-toolchain.sh', 'toolchain/**') }}

      - name: Build or validate toolchain
        env:
          CACHE_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            bash scripts/verify-stage.sh toolchain
          else
            make PROFILE="$RELEASE_PROFILE" toolchain
          fi
          bash scripts/verify-stage.sh toolchain
          mkdir -p build/.markers
          touch build/.markers/.toolchain

      - name: Save validated toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            build/tools
            build/sysroot
          key: shreeos-toolchain-cache-v3-abi-glibc2.40-gcc14.2.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.conf', 'scripts/common.sh', 'scripts/verify-stage.sh', 'tests/smoke/test-toolchain.sh', 'toolchain/**') }}

      - name: Build desktop ISO
        env:
          PROFILE: desktop
          ALLOW_DEFERRED_GRAPHICS: '0'
          BIOS_TIMEOUT: '240'
          UEFI_TIMEOUT: '300'
          MEMORY: 4096M
        run: |
          mkdir -p build-logs
          bash scripts/build.sh desktop 2>&1 | tee build-logs/build-desktop.log

      - name: Require real desktop graphics stack
        env:
          PROFILE: desktop
        run: |
          bash scripts/verify-stage.sh desktop
          bash scripts/verify-stage.sh rootfs
          bash scripts/verify-stage.sh iso
          bash scripts/graphics-readiness.sh --strict
          status_file="build/rootfs/etc/shreeos/desktop-native.status"
          test -f "$status_file"
          test "$(tr -d '\r\n' < "$status_file")" = ready

      - name: Run desktop-aware tests
        env:
          PROFILE: desktop
          BIOS_TIMEOUT: '240'
          UEFI_TIMEOUT: '300'
          MEMORY: 4096M
        run: make test-all

      - name: Validate and stage release assets
        run: |
          source build.conf
          mapfile -t iso_paths < <(find out -maxdepth 1 -type f -name '*.iso' -print | sort)
          [[ "${#iso_paths[@]}" -eq 1 ]]
          iso_path="${iso_paths[0]}"
          iso_name="$(basename "$iso_path")"
          manifest="out/${iso_name%.iso}-manifest.json"
          checksum="${iso_path}.sha256"
          test -s "$iso_path"
          test -s "$manifest"
          test -s "$checksum"
          EXPECTED_NAME="$DISTRO_NAME" EXPECTED_VERSION="$DISTRO_VERSION" EXPECTED_COMMIT="$GITHUB_SHA" python3 - "$iso_path" "$manifest" <<'PY'
          import hashlib, json, os, pathlib, sys
          iso = pathlib.Path(sys.argv[1])
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          checks = {
              'name': os.environ['EXPECTED_NAME'],
              'version': os.environ['EXPECTED_VERSION'],
              'profile': 'desktop',
              'commit': os.environ['EXPECTED_COMMIT'],
              'iso': iso.name,
          }
          for key, expected in checks.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f'manifest {key} mismatch: {manifest.get(key)!r} != {expected!r}')
          if manifest.get('size_bytes') != iso.stat().st_size:
              raise SystemExit('manifest size mismatch')
          digest = hashlib.sha256(iso.read_bytes()).hexdigest()
          if manifest.get('sha256') != digest:
              raise SystemExit('manifest checksum mismatch')
          print(f'Desktop release manifest certified: {iso.name} ({iso.stat().st_size} bytes)')
          PY
          (
            cd out
            sha256sum "$iso_name" > SHA256SUMS
            sha256sum -c SHA256SUMS
            sha256sum -c "$iso_name.sha256"
          )
          rm -rf release-assets
          mkdir release-assets
          cp "$iso_path" "$checksum" "$manifest" out/SHA256SUMS release-assets/

      - name: Upload certified desktop bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-desktop-release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            build/logs/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  publish:
    if: ${{ needs.build.result == 'success' }}
    name: Publish certified desktop release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download certified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Revalidate checksums
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          mapfile -t checksums < <(find . -maxdepth 1 -type f -name '*.iso.sha256' -print)
          [[ "${#checksums[@]}" -eq 1 ]]
          sha256sum -c "${checksums[0]}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cat > release-notes.md <<EOF
          ShreeOS ${RELEASE_VERSION} desktop-certified release.

          This release is built with PROFILE=desktop and is published only after the native target graphics stack, root filesystem, ISO structure, checksums, BIOS boot, UEFI boot, and automated tests pass. Minimal/headless images are not published as the primary ShreeOS release.
          EOF
          prerelease_arg=()
          [[ "$PRERELEASE" == true ]] && prerelease_arg+=(--prerelease)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "ShreeOS ${RELEASE_VERSION}" --notes-file release-notes.md "${prerelease_arg[@]}"
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "ShreeOS ${RELEASE_VERSION}" --notes-file release-notes.md "${prerelease_arg[@]}"
          fi
