name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Release workflow run ID with a certified ISO build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  RELEASE_VERSION: 0.3.0-prototype
  RELEASE_TAG: v0.3.0-prototype-build.${{ github.run_id }}
  RELEASE_PROFILE: plasma
  RELEASE_ISO: shreeos-0.3.0-prototype-plasma-amd64.iso

jobs:
  build:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]') }}
    name: Build and certify current Plasma prototype
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      options: --privileged
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned live-build and image test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build=1:20250505+deb13u1 \
            debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 qemu-system-gui qemu-utils ovmf xvfb xauth rsync ca-certificates \
            debian-archive-keyring shellcheck python3 librsvg2-bin

      - name: Validate prototype scripts and configuration
        run: |
          bash -n scripts/build-debian-prototype.sh
          bash -n tests/prototype/test-config.sh
          bash -n tests/prototype/test-iso.sh
          shellcheck --severity=error \
            scripts/build-debian-prototype.sh \
            tests/prototype/test-config.sh \
            tests/prototype/test-iso.sh \
            prototype/debian-live/config/includes.chroot/lib/live/config-hooks/2000-lock-live-user \
            prototype/debian-live/config/includes.chroot/usr/local/sbin/shreeos-live-boot-check \
            prototype/debian-live/profiles/plasma/hooks/9001-shreeos-sddm.hook.chroot \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-plasma-first-login \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-plasma-dock \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-open-downloads \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-open-trash \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-theme \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/bin/shreeos-motion \
            prototype/debian-live/features/includes.chroot/usr/local/bin/shreeos-software \
            prototype/debian-live/profiles/plasma/includes.chroot/usr/local/sbin/shreeos-sddm-live-autologin
          bash tests/prototype/test-config.sh
          python3 tests/prototype/test-desktop-config.py
          python3 tests/prototype/test-plasma-config.py
          python3 tests/prototype/test-system-features.py
          python3 tests/prototype/test-search-calculator.py
          python3 tests/prototype/test-workspace-overview.py
          python3 tests/prototype/test-branding.py
          bash tests/release/test-release-asset-split.sh

      - name: Build ShreeOS Plasma ISO
        run: |
          mkdir -p build-logs/prototype-qemu
          SHREEOS_LIVE_PROFILE="$RELEASE_PROFILE" bash scripts/build-debian-prototype.sh
          test -s "out/$RELEASE_ISO"

      - name: Certify BIOS and UEFI boot plus desktop visuals
        run: |
          QEMU_LOG_DIR=build-logs/prototype-qemu \
            bash tests/prototype/test-iso.sh "out/$RELEASE_ISO" "$RELEASE_PROFILE"

      - name: Validate release assets
        id: meta
        run: |
          checksum="out/$RELEASE_ISO.sha256"
          asset_prefix="${RELEASE_ISO%-amd64.iso}"
          packages="out/${asset_prefix}-packages.txt"
          build_info="out/${asset_prefix}-build-info.txt"
          for required in "out/$RELEASE_ISO" "$checksum" "$packages" "$build_info"; do
            test -s "$required"
          done
          (
            cd out
            sha256sum -c "$RELEASE_ISO.sha256"
            sha256sum "$RELEASE_ISO" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          rm -rf release-assets
          mkdir release-assets
          cp "out/$RELEASE_ISO" "$checksum" "$packages" "$build_info" out/SHA256SUMS release-assets/
          bash scripts/prepare-release-assets.sh release-assets "$RELEASE_ISO"
          echo "artifact_name=shreeos-plasma-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload certified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload QEMU logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-plasma-release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/prototype-qemu/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'push' && needs.build.result == 'success' }}
    name: Publish ShreeOS Plasma prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download certified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Revalidate checksums
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          if [[ -f "$RELEASE_ISO" ]]; then
            sha256sum -c "$RELEASE_ISO.sha256"
          else
            test -s "$RELEASE_ISO.parts.sha256"
            actual="$(cat -- "$RELEASE_ISO".part-* | sha256sum | awk '{print $1}')"
            expected="$(awk 'NR == 1 {print $1}' "$RELEASE_ISO.sha256")"
            test "$actual" = "$expected"
          fi

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          ShreeOS ${RELEASE_VERSION} Plasma preview.

          Source commit: ${GITHUB_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This prerelease is published only after the current Debian Live Plasma image passes configuration checks, package/asset validation, checksum validation, BIOS boot, UEFI boot, and automated desktop screenshot gates.

          If the ISO is split into numbered parts for GitHub's per-file upload limit, use the included reassembly instructions and verify the reconstructed ISO with its SHA-256 file.

          It is a prototype prerelease, not the final stable ShreeOS release. Installer-to-disk, installed-system update/recovery, broader hardware coverage, and interactive acceptance remain release blockers for a stable version.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "ShreeOS ${RELEASE_VERSION} (build ${GITHUB_RUN_ID})" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "ShreeOS ${RELEASE_VERSION} (build ${GITHUB_RUN_ID})" \
              --notes-file release-notes.md \
              --prerelease
          fi

  republish-tested-build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Repackage and publish an already-tested Plasma build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - name: Check out current release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a successful certified build from master
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" > source-jobs.json
          python3 - <<'PY'
          import json, os, re
          run = json.load(open('source-run.json'))
          jobs = json.load(open('source-jobs.json'))['jobs']
          assert run['status'] == 'completed'
          assert run['path'] == '.github/workflows/release.yml'
          assert run['event'] == 'push' and run['head_branch'] == 'master'
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          build = [j for j in jobs if j['name'] == 'Build and certify current Plasma prototype']
          assert len(build) == 1 and build[0]['conclusion'] == 'success'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"SOURCE_SHA={run['head_sha']}\n")
              env.write(f"ARTIFACT_NAME=shreeos-plasma-release-{run['id']}-{run['run_attempt']}\n")
              env.write(f"RELEASE_TAG=v0.3.0-prototype-build.{run['id']}\n")
          PY
          SOURCE_SHA="$(jq -r .head_sha source-run.json)"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"

      - name: Download the certified build artifact
        run: gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name "$ARTIFACT_NAME" --dir assets

      - name: Verify and prepare release assets
        run: |
          asset_prefix="${RELEASE_ISO%-amd64.iso}"
          test -s "assets/$RELEASE_ISO"
          test -s "assets/$RELEASE_ISO.sha256"
          test -s "assets/${asset_prefix}-packages.txt"
          test -s "assets/${asset_prefix}-build-info.txt"
          (cd assets && sha256sum -c SHA256SUMS && sha256sum -c "$RELEASE_ISO.sha256")
          bash scripts/prepare-release-assets.sh assets "$RELEASE_ISO"
          (
            cd assets
            sha256sum -c SHA256SUMS
            if [[ -f "$RELEASE_ISO" ]]; then
              sha256sum -c "$RELEASE_ISO.sha256"
            else
              test -s "$RELEASE_ISO.parts.sha256"
              actual="$(cat -- "$RELEASE_ISO".part-* | sha256sum | awk '{print $1}')"
              expected="$(awk 'NR == 1 {print $1}' "$RELEASE_ISO.sha256")"
              test "$actual" = "$expected"
            fi
          )

      - name: Publish the verified prototype prerelease
        run: |
          cat > release-notes.md <<EOF
          ShreeOS ${RELEASE_VERSION} Plasma preview.

          Source commit: ${SOURCE_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}

          This prototype passed configuration checks, package/asset validation, checksum validation, BIOS boot, UEFI boot, and automated desktop screenshot gates.

          If the ISO is split into numbered parts for GitHub's per-file upload limit, use the included reassembly instructions and verify the reconstructed ISO with its SHA-256 file.

          This is a development prerelease, not a production or dual-boot-certified release. Installer-to-disk, installed-system update/recovery, broader hardware coverage, and interactive acceptance remain release blockers for a stable version.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "ShreeOS ${RELEASE_VERSION} (build ${SOURCE_RUN})" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" assets/* \
              --target "$SOURCE_SHA" \
              --title "ShreeOS ${RELEASE_VERSION} (build ${SOURCE_RUN})" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Verify published assets and provenance
        run: |
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$release_api" > published-release.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.load(open('published-release.json'))
          local = {p.name: p for p in Path('assets').iterdir() if p.is_file()}
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assert release['target_commitish'] == os.environ['SOURCE_SHA']
          assert release['prerelease'] and not release['draft']
          assert {a['name'] for a in release['assets']} == set(local)
          for asset in release['assets']:
              path = local[asset['name']]
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['size'] < 2_147_483_648
              assert asset['digest'] == f'sha256:{digest}'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published and verified {release['tag_name']} from {os.environ['SOURCE_SHA']} with {len(local)} assets.\n")
          PY
