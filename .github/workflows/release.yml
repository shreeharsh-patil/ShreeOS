name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex gawk texinfo \
            curl patch bzip2 xz-utils bc libssl-dev libelf-dev cpio gzip \
            xorriso grub-pc grub-efi-amd64-bin rsync qemu-system-x86 ovmf \
            libx11-dev libxinerama-dev libxft-dev libcrypt-dev

      - name: Restore cached toolchain & sysroot
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            build/tools
            build/sysroot
          key: toolchain-sysroot-${{ hashFiles('build.conf', 'scripts/common.sh', 'toolchain/scripts/**', 'toolchain/patches/**') }}
          restore-keys: |
            toolchain-sysroot-

      - name: Build Toolchain (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          make toolchain

      - name: Mark cached toolchain ready
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          mkdir -p build/.markers
          touch build/.markers/.toolchain

      - name: Build Desktop ISO Profile
        run: |
          make PROFILE=desktop iso

      - name: Run verification test suite
        run: |
          make test-unit
          bash tests/smoke/run-all.sh
          bash tests/qemu/boot-iso-bios.sh
          bash tests/qemu/boot-iso-uefi.sh
          make test-all

      - name: Create release checksums
        run: |
          cd out
          sha256sum *.iso > SHA256SUMS.txt
          echo "Release artifacts:"
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ShreeOS ${{ github.ref_name }}
          body: |
            ## ShreeOS ${{ github.ref_name }}

            ### Artifacts
            - `shreeos-*.iso` — Hybrid BIOS/UEFI bootable Desktop ISO
            - `SHA256SUMS.txt` — SHA-256 Checksums

            ### Build from Source
            ```bash
            git clone https://github.com/shreeharsh-patil/ShreeOS.git
            cd ShreeOS
            git checkout ${{ github.ref_name }}
            make PROFILE=desktop iso
            ```

            ### Verify & Test Boot
            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            qemu-system-x86_64 -cdrom out/shreeos-*.iso -m 512M
            ```
          files: |
            out/*.iso
            out/SHA256SUMS.txt
