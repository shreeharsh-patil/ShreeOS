name: ISO

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex gawk texinfo \
            curl patch bzip2 xz-utils bc libssl-dev cpio gzip \
            xorriso grub-pc grub-efi-amd64-bin rsync

      - name: Restore cached toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: build/tools
          key: toolchain-${{ hashFiles('build.conf', 'toolchain/scripts/**') }}

      - name: Build toolchain (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          bash toolchain/scripts/build-all.sh --skip-tests

      - name: Build base system
        run: |
          bash base-system/scripts/build-all.sh

      - name: Build kernel
        run: |
          bash kernel/scripts/build-kernel.sh --skip-init

      - name: Build initramfs
        run: |
          make -C kernel/initramfs clean all

      - name: Build kernel with initramfs
        run: |
          bash kernel/scripts/build-kernel.sh

      - name: Build init (PID 1)
        run: |
          export CROSS_COMPILE=x86_64-shreeos-linux-gnu-
          make -C init/src clean all

      - name: Build rootfs
        run: |
          bash base-system/scripts/setup-rootfs.sh
          bash rootfs/scripts/make-rootfs.sh --skip-archive

      - name: Build ISO
        run: |
          bash iso-builder/scripts/build-iso.sh --no-cleanup

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: shreeos-iso
          path: out/*.iso
          if-no-files-found: error

      - name: Generate checksums
        run: |
          cd out && sha256sum *.iso > SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: shreeos-checksums
          path: out/SHA256SUMS.txt
