name: ISO

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: bash scripts/install-build-deps-apt.sh

      - name: Restore cached toolchain & sysroot
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            build/tools
            build/sysroot
          key: toolchain-sysroot-${{ hashFiles('build.conf', 'scripts/common.sh', 'toolchain/scripts/**', 'toolchain/patches/**') }}
          restore-keys: |
            toolchain-sysroot-

      - name: Build toolchain (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          make toolchain

      - name: Mark cached toolchain ready
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          mkdir -p build/.markers
          touch build/.markers/.toolchain

      - name: Run verification & unit tests
        run: |
          make doctor
          bash scripts/verify-sources.sh --fetch --component=base-system
          make test-unit
          bash tests/smoke/run-all.sh

      - name: Build Desktop ISO Profile
        run: |
          ALLOW_DEFERRED_GRAPHICS=1 make PROFILE=desktop iso

      - name: Verify ISO structure and boot paths
        run: |
          # Desktop target graphics are still an explicit deferred layer.
          # CI validates bootability without misrepresenting desktop readiness.
          ALLOW_DEFERRED_GRAPHICS=1 make PROFILE=desktop verify-iso

      - name: Run Comprehensive Test Suite
        run: |
          make test-all

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: shreeos-iso
          path: out/*.iso
          if-no-files-found: error

      - name: Generate checksums
        run: |
          cd out && sha256sum *.iso > SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: shreeos-checksums
          path: out/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="shreeos-build-${GITHUB_RUN_NUMBER}"
          fi

          gh release create "$TAG" out/*.iso out/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "ShreeOS ISO Build #${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --latest
