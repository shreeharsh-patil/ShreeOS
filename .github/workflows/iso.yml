name: ISO

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex gawk texinfo \
            curl patch bzip2 xz-utils bc libssl-dev libelf-dev cpio gzip gperf libgmp-dev libmpfr-dev libmpc-dev pkg-config gettext-base mtools \
            xorriso grub-pc-bin grub-efi-amd64-bin grub-common rsync qemu-system-x86 ovmf \
            libx11-dev libxinerama-dev libxft-dev libcrypt-dev

      - name: Restore cached toolchain & sysroot
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            build/tools
            build/sysroot
          key: toolchain-sysroot-${{ hashFiles('build.conf', 'scripts/common.sh', 'toolchain/scripts/**', 'toolchain/patches/**') }}
          restore-keys: |
            toolchain-sysroot-

      - name: Build toolchain (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          make toolchain

      - name: Mark cached toolchain ready
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          mkdir -p build/.markers
          touch build/.markers/.toolchain

      - name: Run verification & unit tests
        run: |
          make doctor
          make verify-sources
          make test-unit
          bash tests/smoke/run-all.sh

      - name: Build Desktop ISO Profile
        run: |
          make PROFILE=desktop iso

      - name: Run QEMU BIOS & UEFI Boot Tests
        run: |
          bash tests/qemu/boot-iso-bios.sh
          bash tests/qemu/boot-iso-uefi.sh

      - name: Run Comprehensive Test Suite
        run: |
          make test-all

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: shreeos-iso
          path: out/*.iso
          if-no-files-found: error

      - name: Generate checksums
        run: |
          cd out && sha256sum *.iso > SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: shreeos-checksums
          path: out/SHA256SUMS.txt
