name: ISO

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  BUILD_PROFILE: minimal

jobs:
  build:
    name: Build and validate minimal ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize build logs
        run: |
          set -Eeuo pipefail
          mkdir -p build-logs
          printf 'ref=%s\nsha=%s\nprofile=%s\n' "$GITHUB_REF" "$GITHUB_SHA" "$BUILD_PROFILE" > build-logs/context.txt

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          exec > >(tee -a build-logs/dependencies.log) 2>&1
          bash scripts/install-build-deps-apt.sh

      - name: Restore exact toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            build/tools
            build/sysroot
          key: shreeos-toolchain-cache-v3-abi-glibc2.40-gcc14.2.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.conf', 'scripts/common.sh', 'scripts/verify-stage.sh', 'tests/smoke/test-toolchain.sh', 'toolchain/**') }}

      - name: Build or validate toolchain
        env:
          CACHE_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          exec > >(tee -a build-logs/toolchain.log) 2>&1
          if [[ "${CACHE_HIT}" = "true" ]]; then
            bash scripts/verify-stage.sh toolchain
          else
            make PROFILE="$BUILD_PROFILE" toolchain
          fi
          bash scripts/verify-stage.sh toolchain
          bash tests/smoke/test-toolchain.sh
          bash tests/smoke/run-all.sh
          mkdir -p build/.markers
          touch build/.markers/.toolchain

      - name: Save validated toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            build/tools
            build/sysroot
          key: shreeos-toolchain-cache-v3-abi-glibc2.40-gcc14.2.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.conf', 'scripts/common.sh', 'scripts/verify-stage.sh', 'tests/smoke/test-toolchain.sh', 'toolchain/**') }}

      - name: Build and verify minimal ISO
        run: |
          set -Eeuo pipefail
          exec > >(tee -a build-logs/build-minimal.log) 2>&1
          PROFILE="$BUILD_PROFILE" BIOS_TIMEOUT=180 UEFI_TIMEOUT=240 MEMORY=2048M bash scripts/build.sh "$BUILD_PROFILE"

      - name: Run profile-aware automated tests
        run: |
          set -Eeuo pipefail
          exec > >(tee -a build-logs/tests.log) 2>&1
          PROFILE="$BUILD_PROFILE" BIOS_TIMEOUT=180 UEFI_TIMEOUT=240 MEMORY=2048M make test-all

      - name: Generate and verify minimal ISO bundle
        run: |
          set -Eeuo pipefail
          exec > >(tee -a build-logs/assets.log) 2>&1
          source build.conf
          mapfile -t iso_paths < <(find out -maxdepth 1 -type f -name '*.iso' -print | sort)
          if [[ "${#iso_paths[@]}" -ne 1 ]]; then
            printf 'Expected exactly one ISO, found %s\n' "${#iso_paths[@]}" >&2
            exit 1
          fi
          iso_path="${iso_paths[0]}"
          iso_name="$(basename "$iso_path")"
          iso_checksum_path="${iso_path}.sha256"
          manifest_path="out/${iso_name%.iso}-manifest.json"
          for required in "$iso_path" "$iso_checksum_path" "$manifest_path"; do
            if [[ ! -s "$required" ]]; then
              printf 'Missing or empty release input: %s\n' "$required" >&2
              exit 1
            fi
          done
          (
            cd out
            sha256sum -- "$iso_name" > SHA256SUMS
            [[ "$(wc -l < SHA256SUMS)" -eq 1 ]]
            awk -v expected="$iso_name" '$2 == expected { found=1 } END { exit(found == 1 ? 0 : 1) }' SHA256SUMS
            sha256sum -c SHA256SUMS
            [[ "$(wc -l < "$iso_name.sha256")" -eq 1 ]]
            awk -v expected="$iso_name" '$2 == expected { found=1 } END { exit(found == 1 ? 0 : 1) }' "$iso_name.sha256"
            sha256sum -c "$iso_name.sha256"
          )
          EXPECTED_NAME="$DISTRO_NAME" EXPECTED_VERSION="$DISTRO_VERSION" EXPECTED_PROFILE="$BUILD_PROFILE" EXPECTED_COMMIT="$GITHUB_SHA" python3 - "$iso_path" "$manifest_path" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          iso = pathlib.Path(sys.argv[1])
          manifest_path = pathlib.Path(sys.argv[2])
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              raise SystemExit(f"manifest validation failed: {exc}")

          if manifest.get("name") != os.environ["EXPECTED_NAME"]:
              raise SystemExit("manifest name does not match build.conf")
          if manifest.get("version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("manifest version does not match build.conf")
          if manifest.get("profile") != os.environ["EXPECTED_PROFILE"]:
              raise SystemExit("manifest profile does not match the build profile")
          if manifest.get("commit") != os.environ["EXPECTED_COMMIT"]:
              raise SystemExit("manifest commit does not match GITHUB_SHA")
          if manifest.get("iso") != iso.name:
              raise SystemExit("manifest ISO name does not match the generated ISO")
          size = manifest.get("size_bytes")
          if isinstance(size, bool) or not isinstance(size, int) or size != iso.stat().st_size:
              raise SystemExit("manifest ISO size does not match the generated ISO")
          digest = hashlib.sha256(iso.read_bytes()).hexdigest()
          if manifest.get("sha256") != digest:
              raise SystemExit("manifest ISO digest does not match the generated ISO")
          print(f"Manifest validated: {iso.name}")
          PY
          rm -rf release-assets
          mkdir -p release-assets
          cp -- "$iso_path" "$iso_checksum_path" "$manifest_path" out/SHA256SUMS release-assets/
          expected_names=("$iso_name" "$iso_name.sha256" "${iso_name%.iso}-manifest.json" SHA256SUMS)
          for name in "${expected_names[@]}"; do
            if [[ ! -f "release-assets/$name" || -L "release-assets/$name" ]]; then
              printf 'Missing or unsafe bundle member: %s\n' "$name" >&2
              exit 1
            fi
          done
          [[ "$(find release-assets -mindepth 1 -maxdepth 1 -type f -print | wc -l)" -eq 4 ]]
          unexpected="$(find release-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          [[ -z "$unexpected" ]]
          printf 'Validated release bundle: %s\n' "$iso_name"

      - name: Upload tested minimal ISO bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-minimal-iso-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            build/logs/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
