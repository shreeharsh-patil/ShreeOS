name: Debian Live Prototype

on:
  push:
    branches: [master]
    paths:
      - 'prototype/debian-live/**'
      - 'branding/**'
      - 'scripts/build-debian-prototype.sh'
      - 'tests/prototype/**'
      - 'Makefile'
      - '.github/workflows/debian-prototype.yml'
  pull_request:
    branches: [master]
    paths:
      - 'prototype/debian-live/**'
      - 'branding/**'
      - 'scripts/build-debian-prototype.sh'
      - 'tests/prototype/**'
      - 'Makefile'
      - '.github/workflows/debian-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    name: Build and boot the isolated Debian Live prototype
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned live-build and image test tools
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build=1:20250505+deb13u1 \
            debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 qemu-utils ovmf rsync ca-certificates \
            debian-archive-keyring shellcheck python3

      - name: Check shell syntax and errors
        run: |
          set -Eeuo pipefail
          bash -n scripts/build-debian-prototype.sh
          bash -n tests/prototype/test-config.sh
          bash -n tests/prototype/test-iso.sh
          shellcheck --severity=error \
            scripts/build-debian-prototype.sh \
            tests/prototype/test-config.sh \
            tests/prototype/test-iso.sh \
            prototype/debian-live/config/includes.chroot/lib/live/config/9999-lock-live-user \
            prototype/debian-live/config/includes.chroot/usr/local/sbin/shreeos-live-boot-check \
            prototype/debian-live/profiles/desktop/includes.chroot/usr/local/bin/shreeos-dock-session \
            prototype/debian-live/profiles/desktop/includes.chroot/usr/local/bin/shreeos-control-center \
            prototype/debian-live/profiles/desktop/includes.chroot/usr/local/bin/shreeos-open-downloads \
            prototype/debian-live/profiles/desktop/includes.chroot/usr/local/bin/shreeos-open-trash

      - name: Validate prototype configuration
        run: |
          bash tests/prototype/test-config.sh
          python3 tests/prototype/test-desktop-config.py

      - name: Build and boot-test the console base
        run: bash scripts/build-debian-prototype.sh
      - name: Validate base SquashFS and boot in BIOS and UEFI QEMU
        run: |
          set -Eeuo pipefail
          mkdir -p build-logs/prototype-qemu
          QEMU_LOG_DIR=build-logs/prototype-qemu bash tests/prototype/test-iso.sh \
            out/shreeos-0.3.0-prototype-amd64.iso

      - name: Build the optional ShreeOS desktop profile
        run: SHREEOS_LIVE_PROFILE=desktop bash scripts/build-debian-prototype.sh

      - name: Validate desktop package set and boot the XFCE session in BIOS and UEFI QEMU
        run: |
          set -Eeuo pipefail
          mkdir -p build-logs/prototype-qemu
          QEMU_LOG_DIR=build-logs/prototype-qemu bash tests/prototype/test-iso.sh \
            out/shreeos-0.3.0-prototype-desktop-amd64.iso desktop

      - name: Upload base and desktop prototype ISOs, manifests, checksums, and build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-debian-live-prototype-${{ github.sha }}
          path: |
            out/shreeos-0.3.0-prototype*.iso
            out/shreeos-0.3.0-prototype*.iso.sha256
            out/shreeos-0.3.0-prototype*-packages.txt
            out/shreeos-0.3.0-prototype*-build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload QEMU boot logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-prototype-qemu-logs-${{ github.sha }}
          path: build-logs/prototype-qemu/
          if-no-files-found: warn
          retention-days: 30
