name: Kernel

on:
  push:
    branches: [master]
    paths:
      - 'kernel/**'
      - 'build.conf'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison gawk texinfo \
            openssl pkg-config cpio gzip libssl-dev libelf-dev curl patch bzip2 xz-utils

      - name: Restore cached toolchain & sysroot
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            build/tools
            build/sysroot
          key: toolchain-sysroot-${{ hashFiles('build.conf', 'scripts/common.sh', 'toolchain/scripts/**', 'toolchain/patches/**') }}
          restore-keys: |
            toolchain-sysroot-

      - name: Build toolchain (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          bash toolchain/scripts/build-all.sh --skip-tests

      - name: Build kernel
        run: |
          bash kernel/scripts/build-kernel.sh

      - name: Verify kernel image
        run: |
          test -f build/build-kernel/arch/x86/boot/bzImage
          echo "Kernel built: $(wc -c < build/build-kernel/arch/x86/boot/bzImage) bytes"
