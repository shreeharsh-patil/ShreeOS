name: Unified ShreeOS 0.4.0 ISO

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/build-debian-prototype.sh'
      - 'scripts/package-unified-native.sh'
      - 'scripts/shreeinfo'
      - 'scripts/shreeos-native-status'
      - 'scripts/shreeos-verify-installed'
      - 'desktop/apps/shree-sysmon.sh'
      - 'pkgmanager/**'
      - 'prototype/debian-live/**'
      - 'branding/**'
      - 'themes/plasma/**'
      - 'tests/unified/**'
      - 'docs/UNIFIED-IMAGE.md'
      - 'Makefile'
      - '.github/workflows/unified-iso.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/build-debian-prototype.sh'
      - 'scripts/package-unified-native.sh'
      - 'scripts/shreeinfo'
      - 'scripts/shreeos-native-status'
      - 'tests/unified/**'
      - 'Makefile'
      - '.github/workflows/unified-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-shreeos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Package native tools, build Plasma ISO, QEMU BIOS/UEFI tests
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      options: --privileged
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned build and VM testing dependencies
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build=1:20250505+deb13u1 \
            debootstrap xorriso squashfs-tools dpkg-dev \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 qemu-system-gui qemu-utils ovmf xvfb xauth rsync \
            ca-certificates debian-archive-keyring shellcheck python3 librsvg2-bin
      - name: Validate native package and static integration
        run: |
          set -Eeuo pipefail
          bash tests/unified/test-native-package.sh
          bash tests/unified/test-install-boundaries.sh
          bash tests/prototype/test-config.sh
          python3 tests/prototype/test-plasma-config.py
          python3 tests/prototype/test-system-features.py
          python3 tests/prototype/test-branding.py
          shellcheck --severity=error \
            scripts/package-unified-native.sh scripts/shreeos-native-status \
            scripts/shreeos-verify-installed \
            scripts/build-debian-prototype.sh tests/unified/test-native-package.sh \
            tests/unified/test-iso-contents.sh
      - name: Build one unified desktop ISO
        run: make unified-iso
      - name: Check SquashFS and native tools
        run: bash tests/unified/test-iso-contents.sh out/ShreeOS-0.4.0-amd64.iso
      - name: Boot BIOS and UEFI Plasma and verify visible desktop
        run: |
          set -Eeuo pipefail
          mkdir -p build-logs/unified-qemu
          QEMU_LOG_DIR=build-logs/unified-qemu \
            bash tests/prototype/test-iso.sh out/ShreeOS-0.4.0-amd64.iso plasma
      - name: Upload development ISO, checksum and manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-0.4.0-unified-development-${{ github.sha }}
          path: |
            out/ShreeOS-0.4.0-amd64.iso
            out/ShreeOS-0.4.0-amd64.iso.sha256
            out/ShreeOS-0.4.0-packages.txt
            out/ShreeOS-0.4.0-build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve BIOS/UEFI logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-0.4.0-unified-qemu-logs-${{ github.sha }}
          path: build-logs/unified-qemu/
          if-no-files-found: warn
          retention-days: 30

# Intentionally no public Release job. Calamares disk installation and
# detached-media boot must be verified first; Live boot tests do not prove it.
