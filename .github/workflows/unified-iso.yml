name: Unified ShreeOS development ISO

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/unified-iso.yml'
      - 'Makefile'
      - 'VERSION'
      - 'build.conf'
      - 'LICENSE'
      - 'docs/**'
      - 'release/INSTALL-ACCEPTANCE.md'
      - 'scripts/**'
      - 'desktop/**'
      - 'hardware/**'
      - 'pkgmanager/**'
      - 'prototype/debian-live/**'
      - 'branding/**'
      - 'themes/plasma/**'
      - 'tests/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/unified-iso.yml'
      - 'Makefile'
      - 'VERSION'
      - 'build.conf'
      - 'LICENSE'
      - 'docs/**'
      - 'release/INSTALL-ACCEPTANCE.md'
      - 'scripts/**'
      - 'desktop/**'
      - 'hardware/**'
      - 'pkgmanager/**'
      - 'prototype/debian-live/**'
      - 'branding/**'
      - 'themes/plasma/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-shreeos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build-and-test:
    name: Package native tools, build Plasma ISO, QEMU BIOS/UEFI tests
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      options: --privileged
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned build and VM testing dependencies
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build=1:20250505+deb13u1 \
            gcc make libc6-dev \
            debootstrap xorriso squashfs-tools dpkg-dev \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 qemu-system-gui qemu-utils ovmf xvfb xauth rsync util-linux \
            ca-certificates debian-archive-keyring shellcheck python3 librsvg2-bin git
      - name: Validate native package and static integration
        run: |
          set -Eeuo pipefail
          bash tests/unified/test-native-package.sh
          bash tests/unified/test-install-boundaries.sh
          if ! getent group shree-hardware >/dev/null 2>&1; then
            groupadd --system shree-hardware
          fi
          make -C hardware test
          bash tests/prototype/test-config.sh
          python3 tests/prototype/test-plasma-config.py
          python3 tests/prototype/test-system-features.py
          python3 tests/prototype/test-branding.py
          shellcheck --severity=error \
            scripts/package-unified-native.sh scripts/shreeos-native-status \
            scripts/shreeos-verify-installed \
            scripts/build-debian-prototype.sh tests/unified/test-native-package.sh \
            tests/unified/test-iso-contents.sh
      - name: Build one unified desktop ISO
        run: make unified-iso
      - name: Check SquashFS and native tools
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          iso="out/shreeos(${version}).iso"
          bash tests/unified/test-iso-contents.sh "$iso"
      - name: Verify ISO provenance and enforce the 1.9 GB size cap
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          iso="out/shreeos(${version}).iso"
          catalog_report="out/shreeos(${version})-eltorito.txt"
          test "$(stat -c '%s' "$iso")" -lt 1900000000
          xorriso -indev "$iso" -report_el_torito plain 2>&1 | tee "$catalog_report"
          grep -Eq '^El Torito boot img[[:space:]]*:[[:space:]]*[0-9]+[[:space:]]+BIOS[[:space:]]+y([[:space:]]|$)' "$catalog_report"
          grep -Eq '^El Torito boot img[[:space:]]*:[[:space:]]*[0-9]+[[:space:]]+UEFI[[:space:]]+y([[:space:]]|$)' "$catalog_report"
          python3 scripts/verify-unified-artifact.py \
            "$iso" "$iso.sha256" \
            "out/shreeos(${version})-packages.txt" \
            "out/shreeos(${version})-build-info.txt" \
            "out/shreeos(${version})-manifest.json" \
            "$version" plasma x86_64 trixie 20260929T000000Z 1:20250505+deb13u1
      - name: Boot BIOS and UEFI Plasma and verify visible desktop
        run: |
          set -Eeuo pipefail
          mkdir -p build-logs/unified-qemu
          version="$(tr -d '[:space:]' < VERSION)"
          iso="out/shreeos(${version}).iso"
          QEMU_LOG_DIR=build-logs/unified-qemu \
            bash tests/prototype/test-iso.sh "$iso" plasma
      - name: Prepare checksums for the immutable install-acceptance artifact
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          iso="shreeos(${version}).iso"
          (cd out && sha256sum --check "$iso.sha256")
          (cd out && sha256sum -- "$iso" > SHA256SUMS)
      - name: Upload development ISO, checksum and manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-unified-development-${{ github.sha }}
          path: |
            out/shreeos*.iso
            out/shreeos*.iso.sha256
            out/SHA256SUMS
            out/shreeos*-eltorito.txt
            out/shreeos*-packages.txt
            out/shreeos*-build-info.txt
            out/shreeos*-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve BIOS/UEFI logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shreeos-unified-qemu-logs-${{ github.sha }}
          path: build-logs/unified-qemu/
          if-no-files-found: warn
          retention-days: 30

# Intentionally no public Release job. Calamares disk installation and
# detached-media boot must be verified first; Live boot tests do not prove it.
