#!/usr/bin/env bash
# build.conf — single source of truth for the ShreeOS build.
# Every script under toolchain/, kernel/, rootfs/, etc. sources this file.
# Do not hardcode any of these values elsewhere.

# --- Branding -----------------------------------------------------------
export DISTRO_NAME="ShreeOS"
export DISTRO_CODENAME="shreeos"
export DISTRO_VERSION="0.2.0-dev"
export DISTRO_ID="shreeos"               # used in /etc/os-release, package names

# --- Target platform ------------------------------------------------------
export SHREEOS_ARCH="x86_64"
export SHREEOS_TARGET_TRIPLET="x86_64-shreeos-linux-gnu"
export LUMEN_ARCH="${SHREEOS_ARCH}"
export LUMEN_TARGET_TRIPLET="${SHREEOS_TARGET_TRIPLET}"

# --- Paths (all relative to repo root unless absolute) --------------------
export SHREEOS_ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)"
export SHREEOS_BUILD_DIR="${SHREEOS_ROOT_DIR}/build"          # scratch/build artifacts (gitignored)
export SHREEOS_TOOLS="${SHREEOS_BUILD_DIR}/tools"              # cross-toolchain install prefix
export SHREEOS_SYSROOT="${SHREEOS_BUILD_DIR}/sysroot"          # target headers/libs for the cross compiler
export SHREEOS_STAGE_ROOT="${SHREEOS_BUILD_DIR}/rootfs"        # assembled target root filesystem
export SHREEOS_SOURCES="${SHREEOS_BUILD_DIR}/sources"          # downloaded upstream tarballs
export SHREEOS_OUT="${SHREEOS_ROOT_DIR}/out"                   # final artifacts (ISOs, packages)

# Legacy / compatibility aliases
export LUMEN_ROOT_DIR="${SHREEOS_ROOT_DIR}"
export LUMEN_BUILD_DIR="${SHREEOS_BUILD_DIR}"
export LUMEN_TOOLS="${SHREEOS_TOOLS}"
export LUMEN_SYSROOT="${SHREEOS_SYSROOT}"
export LUMEN_STAGE_ROOT="${SHREEOS_STAGE_ROOT}"
export LUMEN_SOURCES="${SHREEOS_SOURCES}"
export LUMEN_OUT="${SHREEOS_OUT}"

# --- Component versions (pinned; checksums live alongside each sources.list) ---
# Populated as each milestone lands. Keeping the variables declared here now
# so every later script can rely on them existing.
export VER_BINUTILS="2.43.1"
export VER_GCC="14.2.0"
export VER_GLIBC="2.40"
export VER_LINUX_KERNEL="6.18"

# --- Build parallelism ------------------------------------------------------
export SHREEOS_MAKE_JOBS="$(nproc 2>/dev/null || echo 4)"
export LUMEN_MAKE_JOBS="${SHREEOS_MAKE_JOBS}"

# --- Sanity check helper -----------------------------------------------------
shreeos_require_dir() {
  mkdir -p "$1"
}
lumen_require_dir() {
  shreeos_require_dir "$@"
}

