#!/usr/bin/env bash
# build.conf — single source of truth for the Lumen Linux build.
# Every script under toolchain/, kernel/, rootfs/, etc. sources this file.
# Do not hardcode any of these values elsewhere.

# --- Branding -----------------------------------------------------------
export DISTRO_NAME="Lumen Linux"
export DISTRO_CODENAME="lumen"
export DISTRO_VERSION="0.1.0-dev"
export DISTRO_ID="lumen"                 # used in /etc/os-release, package names

# --- Target platform ------------------------------------------------------
export LUMEN_ARCH="x86_64"
export LUMEN_TARGET_TRIPLET="x86_64-lumen-linux-gnu"

# --- Paths (all relative to repo root unless absolute) --------------------
export LUMEN_ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)"
export LUMEN_BUILD_DIR="${LUMEN_ROOT_DIR}/build"          # scratch/build artifacts (gitignored)
export LUMEN_TOOLS="${LUMEN_BUILD_DIR}/tools"              # cross-toolchain install prefix
export LUMEN_SYSROOT="${LUMEN_BUILD_DIR}/sysroot"          # target headers/libs for the cross compiler
export LUMEN_STAGE_ROOT="${LUMEN_BUILD_DIR}/rootfs"        # assembled target root filesystem
export LUMEN_SOURCES="${LUMEN_BUILD_DIR}/sources"          # downloaded upstream tarballs
export LUMEN_OUT="${LUMEN_ROOT_DIR}/out"                   # final artifacts (ISOs, packages)

# --- Component versions (pinned; checksums live alongside each sources.list) ---
# Populated as each milestone lands. Keeping the variables declared here now
# so every later script can rely on them existing.
export VER_BINUTILS=""
export VER_GCC=""
export VER_GLIBC=""
export VER_LINUX_KERNEL=""

# --- Build parallelism ------------------------------------------------------
export LUMEN_MAKE_JOBS="$(nproc 2>/dev/null || echo 4)"

# --- Sanity check helper -----------------------------------------------------
lumen_require_dir() {
  mkdir -p "$1"
}
