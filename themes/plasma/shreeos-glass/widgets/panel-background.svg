<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <style id="current-color-scheme">
    .ColorScheme-Background { color: #f5f5f7; }
    .ColorScheme-Text { color: #1d1d1f; }
  </style>
  <!-- Nine slices keep a thin, flat menu bar at any resolution. Plasma injects
       the active color scheme; only this surface is overridden from Breeze. -->
  <g class="ColorScheme-Background" fill="currentColor" fill-opacity=".82">
    <rect id="center" x="20" y="20" width="60" height="60"/>
    <rect id="top" x="20" y="19" width="60" height="1"/>
    <rect id="topleft" x="19" y="19" width="1" height="1"/>
    <rect id="topright" x="80" y="19" width="1" height="1"/>
    <rect id="left" x="19" y="20" width="1" height="60"/>
    <rect id="right" x="80" y="20" width="1" height="60"/>
  </g>
  <g class="ColorScheme-Text" fill="currentColor" fill-opacity=".14">
    <rect id="bottom" x="20" y="80" width="60" height="1"/>
    <rect id="bottomleft" x="19" y="80" width="1" height="1"/>
    <rect id="bottomright" x="80" y="80" width="1" height="1"/>
  </g>
  <rect id="hint-top-margin" x="5" y="5" width="1" height="1" fill="#f00"/>
  <rect id="hint-bottom-margin" x="5" y="8" width="1" height="1" fill="#f00"/>
  <rect id="hint-left-margin" x="5" y="11" width="8" height="1" fill="#f00"/>
  <rect id="hint-right-margin" x="5" y="14" width="8" height="1" fill="#f00"/>
</svg>
