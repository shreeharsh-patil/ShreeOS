# /etc/services.d/20-network.conf — resilient wired DHCP initialization
name=network
command=/bin/sh -c "ip link set lo up 2>/dev/null || ifconfig lo 127.0.0.1 up 2>/dev/null || true; for n in /sys/class/net/*; do i=${n##*/}; [ \"$i\" = lo ] && continue; [ \"$(cat \"$n/type\" 2>/dev/null)\" = 1 ] || continue; ip link set \"$i\" up 2>/dev/null || continue; dhcpcd -w -t 20 \"$i\" 2>/dev/null || udhcpc -n -q -T 3 -t 3 -i \"$i\" 2>/dev/null || true; done; exit 0"
after=hostname
restart=never
oneshot=true
critical=false
