# /etc/services.d/20-network.conf — resilient wired DHCP initialization
#
# The inner script MUST be single-quoted. init runs the whole command value
# through one `/bin/sh -c`, so a double-quoted inner script is expanded by
# that outer shell before the inner shell ever sees it: ${n##*/} and
# $(cat "$n/type") would be resolved with an unset `n`, leaving every
# interface name empty and turning the whole DHCP loop into a no-op.
name=network
command=/bin/sh -c 'ip link set lo up || exit 1; for n in /sys/class/net/*; do i=${n##*/}; [ "$i" = lo ] && continue; if [ -d "$n/wireless" ] || [ -d "$n/phy80211" ]; then continue; fi; [ "$(cat "$n/type" 2>/dev/null)" = 1 ] || continue; ip link set "$i" up || continue; udhcpc -n -q -T 3 -t 3 -i "$i" || echo "[network] DHCP failed on $i" >&2; done'
after=hostname,mdev
restart=never
oneshot=true
critical=false
