# /etc/services.d/10-hostname.conf — Configure system hostname
#
# The inner script is single-quoted so that only the inner shell expands
# $(cat ...); init runs the whole command value through one `/bin/sh -c`.
name=hostname
command=/bin/sh -c 'hostname "$(cat /etc/hostname 2>/dev/null || echo shreeos)"'
after=sysinit
restart=never
oneshot=true
critical=false
