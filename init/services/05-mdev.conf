# /etc/services.d/05-mdev.conf — Populate /dev when mdev is available
name=mdev
command=/bin/sh -c "printf '/sbin/mdev' > /proc/sys/kernel/hotplug; /usr/bin/mdev -s || { echo '[mdev] initial device scan failed; devtmpfs remains active' >&2; true; }"
after=sysinit
before=network
restart=never
oneshot=true
critical=true
