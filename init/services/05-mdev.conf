# /etc/services.d/05-mdev.conf — Populate /dev when mdev is available
#
# The inner script MUST be single-quoted: init runs the whole command value
# through one `/bin/sh -c`, so a double-quoted inner script would be expanded
# by that outer shell before the inner shell ever sees it.
name=mdev
command=/bin/sh -c 'printf "/sbin/mdev" > /proc/sys/kernel/hotplug; /usr/bin/mdev -s || { echo "[mdev] initial device scan failed; devtmpfs remains active" >&2; true; }'
after=sysinit
restart=never
oneshot=true
critical=true
