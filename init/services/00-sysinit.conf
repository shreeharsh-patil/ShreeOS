# /etc/services.d/00-sysinit.conf — Early system initialization
#
# The inner script is single-quoted so that only the inner shell expands it;
# init runs the whole command value through one `/bin/sh -c`.
name=sysinit
command=/bin/sh -c 'mkdir -p /tmp /var/log /var/run /run /var/lib/lpm'
after=
restart=never
oneshot=true
critical=true
