# Calamares 3.3.14 installs the bootloader for the firmware that started the
# live session. Install the second GRUB target only after validating the
# mounted ESP and matching GPT BIOS Boot Partition on the same target disk.
dontChroot: true
timeout: 300
verbose: true
script:
  - '/bin/sh /usr/local/libexec/shreeos-install-bios-grub "${ROOT}" "${gs[firmwareType]}"'
