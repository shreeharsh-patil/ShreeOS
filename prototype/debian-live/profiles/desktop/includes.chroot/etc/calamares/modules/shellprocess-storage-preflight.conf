# Validate the selected target before copying the ShreeOS filesystem.
# Partitioning and formatting have already run at this point and cannot be
# rolled back automatically if the selected layout is unsupported.
dontChroot: true
timeout: 300
verbose: true
script:
  - '/bin/sh /usr/local/libexec/shreeos-install-bios-grub "${ROOT}" "${gs[firmwareType]}" --validate-only'
