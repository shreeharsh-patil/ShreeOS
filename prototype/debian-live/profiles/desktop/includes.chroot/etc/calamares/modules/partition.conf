# Options supported by the Debian Trixie Calamares 3.3.14 partition module.
defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
defaultFileSystemType: ext4
initialPartitioningChoice: none

efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 100MiB
  label: SHREEOS-ESP

# Calamares prepends the ESP to this guided layout when booted in EFI mode.
# The unformatted BIOS Boot Partition lets GRUB embed its BIOS core image on
# the same GPT disk, enabling that installed disk to boot in either firmware.
partitionLayout:
  - name: SHREEOS-BIOS
    type: "21686148-6449-6E6F-744E-656564454649"
    filesystem: unformatted
    size: 2MiB
  - name: ShreeOS
    filesystem: ext4
    mountPoint: /
    size: 100%
