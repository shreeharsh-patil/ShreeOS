---
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
  - id: storage-preflight
    module: shellprocess
    config: shellprocess-storage-preflight.conf
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - shellprocess@storage-preflight
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - shellprocess
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - shreeos-sources
  - umount
- show:
  - finished

branding: shreeos
prompt-install: true
dont-chroot: false
