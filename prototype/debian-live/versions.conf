# Repository snapshot used to assemble the unified ShreeOS Debian Live image.
# Update this deliberately, inspect the package manifest, then re-run QEMU.
DEBIAN_SUITE=trixie
DEBIAN_SNAPSHOT=20260929T000000Z
LIVE_BUILD_VERSION='1:20250505+deb13u1'

# The image version is NOT defined here. The repository-root VERSION file is the
# single authoritative source; it is read here so that every consumer of this
# file (the builder, the configuration contract test, and CI) sees the same
# value, and so drift between the two files is impossible.
if [ -z "${BASH_SOURCE[0]:-}" ]; then
  echo 'versions.conf must be sourced by bash, not executed.' >&2
  exit 2
fi
_shreeos_version_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"
PROTOTYPE_VERSION="$(tr -d '[:space:]' < "${SHREEOS_VERSION_FILE:-${_shreeos_version_root}/VERSION}")"
if ! [[ "$PROTOTYPE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
  echo "Invalid ShreeOS version '${PROTOTYPE_VERSION}' in ${_shreeos_version_root}/VERSION" >&2
  exit 2
fi
export PROTOTYPE_VERSION
export SHREEOS_VERSION_FILE="${SHREEOS_VERSION_FILE:-${_shreeos_version_root}/VERSION}"
unset _shreeos_version_root
